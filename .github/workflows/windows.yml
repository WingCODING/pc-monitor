name: Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: agent/go.sum

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: desktop/**/*.gradle*

      - name: Testar agente
        working-directory: agent
        run: go test ./...

      - name: Compilar agente Windows
        working-directory: agent
        run: >-
          go build -trimpath -ldflags "-s -w -H=windowsgui"
          -o ../desktop/composeApp/packaging/resources/windows/pc-monitor-agent.exe
          ./cmd/server

      - name: Testar desktop
        working-directory: desktop
        run: ./gradlew.bat :composeApp:jvmTest

      - name: Gerar instaladores
        working-directory: desktop
        run: ./gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      - name: Reunir artefatos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem desktop/composeApp/build/compose/binaries/main -Recurse -Include *.msi,*.exe |
            Copy-Item -Destination release
          Get-ChildItem release | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: pc-monitor-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Anexar à GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" release/* --clobber
